<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — PANTIK</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><header class="nav"><a class="brand" href="index.html">PANTIK<span>®</span></a><a class="nav-admin" href="index.html">KEMBALI KE SITUS ↗</a></header><main class="admin-wrap"><p class="section-no">PANTIK / CONTROL ROOM</p><h1 class="admin-title">RUANG<br><em>REDAKSI.</em></h1><section id="loginBox" class="panel"><h2>Masuk sebagai admin</h2><p>Gunakan akun admin yang dibuat melalui Supabase Authentication.</p><label>Email<input id="email" type="email" autocomplete="username" placeholder="email admin"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="password"></label><button id="login">MASUK ↗</button><p id="message" class="message"></p></section><section id="dashboard" class="panel" hidden><div class="dash-head"><h2>Kelola karya</h2><button id="logout" class="secondary">KELUAR</button></div><form id="workForm"><input type="hidden" id="workId"><label>Judul<input id="title" required></label><div class="two"><label>Nama penulis<input id="author" required></label><label>Kategori<input id="category" placeholder="Esai, Puisi, Cerita"></label></div><label>Ringkasan<textarea id="excerpt" rows="2"></textarea></label><label>Isi karya<textarea id="content" rows="10" required></textarea></label><label>Gambar sampul (opsional)<input id="cover" type="file" accept="image/*"></label><label class="check"><input id="published" type="checkbox"> Terbitkan sekarang</label><button type="submit">SIMPAN KARYA ↗</button><button type="button" id="reset" class="secondary">KARYA BARU</button></form><h3>Daftar karya</h3><div id="manageList"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
