<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karya — PANTIK</title><link rel="stylesheet" href="style.css"><style>.article{max-width:850px;margin:90px auto;padding:0 25px 120px}.article h1{font-size:clamp(48px,9vw,100px);line-height:.9;letter-spacing:-.08em;margin:30px 0}.article .body{white-space:pre-wrap;color:#c4c2ba;font-size:18px;line-height:1.9;margin-top:45px}.article img{width:100%;max-height:480px;object-fit:cover;margin-top:25px}.article .meta{font:11px 'Space Mono';color:var(--acid)}</style></head><body><header class="nav"><a class="brand" href="index.html">PANTIK<span>®</span></a><a class="nav-admin" href="index.html#arsip">← ARSIP</a></header><main class="article" id="article"><p class="section-no">PANTIK / RUANG KARYA</p><h1>Memuat karya...</h1></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async()=>{const c=window.PANTIK_CONFIG||{};if(!c.SUPABASE_URL||c.SUPABASE_URL.startsWith('ISI_'))return;const db=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');const {data,error}=await db.from('works').select('*').eq('id',id).eq('published',true).single();const el=document.getElementById('article');el.innerHTML='';if(error||!data){el.textContent='Karya tidak ditemukan.';return;}const meta=document.createElement('p');meta.className='meta';meta.textContent=(data.category||'KARYA')+' / '+(data.author||'PANTIK');const h=document.createElement('h1');h.textContent=data.title;const by=document.createElement('p');by.className='section-no';by.textContent=data.author||'PANTIK';el.append(meta,h,by);if(data.cover_url){const img=document.createElement('img');img.src=data.cover_url;img.alt=data.title;el.append(img);}const body=document.createElement('div');body.className='body';body.textContent=data.content||'';el.append(body);})();</script></body></html>
